# Deployed manually to /etc/haproxy/haproxy.cfg on the sandbox -- not
# templated/auto-synced like the per-client docker-compose configs, since
# this is one static host-level file, not something render_client.py
# generates per client. Edit here, validate with `haproxy -c -f`, then
# copy to the sandbox and `systemctl restart haproxy`.
#
# ERP16 dress-rehearsal HAProxy config -- routes by pseudo-domain
# (<client>.erp16-sandbox.test) to each client's already-published
# 127.0.0.1:<http_port> backend. Deliberately mirrors the routing/logging
# mechanism a real erp16.orion-instruments.io HAProxy would use (docs/
# ROADMAP.md, 2026-08-06) -- HAProxy only ever reads the Host header off
# the request, so this config is directly reusable at real cutover with
# nothing more than a domain-string swap.
#
# Tunnel-only, same as staging: bound to 127.0.0.1 only, never a public
# port, never exposed beyond an SSH tunnel from the operator's laptop.

global
    log /dev/log local0
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    option httplog
    log global

frontend erp16_sandbox
    bind 127.0.0.1:8443
    acl host_orion_internal      hdr_dom(host) -i orion-internal.erp16-sandbox.test
    acl host_orion_test          hdr_dom(host) -i orion-test.erp16-sandbox.test
    acl host_parus_instruments   hdr_dom(host) -i parus-instruments.erp16-sandbox.test
    acl host_puna_eye_care       hdr_dom(host) -i puna-eye-care.erp16-sandbox.test
    acl host_db_test             hdr_dom(host) -i db-test.erp16-sandbox.test
    acl host_staging             hdr_dom(host) -i staging.erp16-sandbox.test

    # Backend names are exactly "be_<client_id>" using clients.yaml's own
    # spelling (orion-internal keeps its hyphen) -- the collector's
    # haproxy tailer strips the "be_" prefix and reports the rest
    # verbatim as `client`, so this must match every other source's
    # client naming exactly, not just be internally consistent.
    use_backend be_orion-internal      if host_orion_internal
    use_backend be_orion_test          if host_orion_test
    use_backend be_parus_instruments   if host_parus_instruments
    use_backend be_puna_eye_care       if host_puna_eye_care
    use_backend be_db_test             if host_db_test
    use_backend be_staging             if host_staging
    default_backend be_unrecognized

backend be_orion-internal
    server web1 127.0.0.1:8069

backend be_orion_test
    server web1 127.0.0.1:8089

backend be_parus_instruments
    server web1 127.0.0.1:8079

backend be_puna_eye_care
    server web1 127.0.0.1:8099

backend be_db_test
    server web1 127.0.0.1:8109

backend be_staging
    server web1 127.0.0.1:8209

# Anything not matching a known pseudo-domain -- deliberately a dead
# backend (no server) rather than silently falling through to some
# default client, so a typo'd hostname fails loudly (503) instead of
# routing to the wrong client's data.
backend be_unrecognized
