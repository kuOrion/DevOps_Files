# Real production's actual deployed HAProxy config, captured 2026-08-15 --
# NOT generated/templated by this repo, deployed manually to
# /etc/haproxy/haproxy.cfg on erp16-production, same workflow as
# config/haproxy.cfg (the sandbox rehearsal version): edit here, validate
# with `haproxy -c -f`, copy to the box, `systemctl reload` (not restart --
# reload is zero-downtime, restart drops every active connection).
#
# This file predates this project's own HAProxy work -- the TLS
# termination (frontend https-in, real cert via certbot) and the base
# single-client routing to orion-internal already existed on production
# before Phase 3 (real implementation) started. What Phase 3 added on
# 2026-08-15: per-client host-based routing (the 4 non-orion-internal
# backends + ACLs), the HTTP->HTTPS redirect, `option forwardfor`,
# X-Forwarded-Proto correctness, and switching the log target from UDP
# (127.0.0.1:514, silently broken -- imudp is disabled in this host's
# rsyslog.conf) to /dev/log (Unix socket, correct, matches the sandbox's
# config/haproxy.cfg which used the right form from the start).
#
# Differs from config/haproxy.cfg (the sandbox rehearsal version) in real,
# not cosmetic, ways: real public binds (*:80, *:443) instead of tunnel-
# only 127.0.0.1:8443; real domains (erp16.orion-instruments.io and
# <client>.erp16.orion-instruments.io) instead of pseudo-domains
# (*.erp16-sandbox.test); a real Let's Encrypt cert instead of none; the
# `be_<client_id>` backend-naming convention was actually established
# here, on real production, then is what DevOps_Files/scripts/
# logging_collector.py's HAProxy parser was written against -- keep any
# new client's backend name in that exact form or the logging collector
# silently mis-attributes its request logs (see the comment above
# `backend be_orion-internal` below).
#
# SECURITY NOTE, do not skip on a fresh deploy: the `stats auth` line
# below is still the credential this config had when captured -- it's
# one of the 5 confirmed-exposed credentials awaiting rotation (see
# ERP16/CLAUDE.md "Still-open security TODOs"). Rotate it as part of
# that batch, don't reuse this file's password verbatim on a fresh box.
#
# Certbot renewal hooks this config depends on (NOT captured in this
# file, see config/certbot-hooks/ instead, deploy to
# /etc/letsencrypt/renewal-hooks/<pre|post|deploy>/ on a fresh box):
# stopping/starting HAProxy around each standalone-auth renewal, and
# rebuilding the /etc/ssl/private/erp16.orion-instruments.io.pem bundle
# HAProxy actually reads (certbot's own fullchain.pem/privkey.pem in
# /etc/letsencrypt/live/ are NOT what this config points at directly).
# Without these hooks, the cert silently goes stale at the next real
# renewal -- confirmed as a real, pre-existing gap on 2026-08-15, not a
# hypothetical.
#
# DNS this config depends on (see config/DNS_RECORDS.md): 5 A records at
# a third-party registrar (QualiSpace/managedns.org), all pointing to
# this box's public IP -- entirely outside AWS, not automatable via any
# IAM this project has access to.

global
 ulimit-n 1000
 maxconn 200
 maxpipes 200
 tune.maxaccept 200
 # /dev/log (Unix socket, imuxsock -- already active) not 127.0.0.1:514
 # (UDP, imudp) -- confirmed 2026-08-15 that imudp is disabled in
 # rsyslog.conf on real production, so the UDP form was silently dropping
 # every httplog request line (only HAProxy's own stderr lifecycle/health-
 # check messages were ever landing in haproxy.log, via journald -- easy
 # to mistake for "access logging works" from mtime/tail alone, it does
 # not). HAProxy isn't chrooted here, so /dev/log is directly reachable,
 # no need to enable a UDP listener at all, even loopback-only.
 log /dev/log local0
 log /dev/log local1 notice
 ca-base /etc/ssl/certs
 crt-base /etc/ssl/private
 ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
 ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
 ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
 log global
 mode http
 timeout connect 5000ms
 timeout client 50000ms
 timeout server 50000ms
 timeout tunnel  1h
 default-server init-addr none

listen stats
 bind 127.0.0.1:9999
 mode http
 stats enable
 stats hide-version
 stats uri /haproxy?stats
 stats auth admin:admin@123

frontend http-in
 bind *:80
 option httplog
 http-request redirect scheme https unless { ssl_fc }
 acl host_oriontest hdr_dom(host) -i oriontest.erp16.orion-instruments.io
 acl host_dbtest hdr_dom(host) -i dbtest.erp16.orion-instruments.io
 acl host_parusinstruments hdr_dom(host) -i parusinstruments.erp16.orion-instruments.io
 acl host_punaeyecare hdr_dom(host) -i punaeyecare.erp16.orion-instruments.io
 use_backend be_orion_test if host_oriontest
 use_backend be_db_test if host_dbtest
 use_backend be_parus_instruments if host_parusinstruments
 use_backend be_puna_eye_care if host_punaeyecare
 default_backend be_orion-internal

frontend https-in
 bind *:443 ssl crt /etc/ssl/private/erp16.orion-instruments.io.pem
 mode http
 option httplog
 acl host_oriontest hdr_dom(host) -i oriontest.erp16.orion-instruments.io
 acl host_dbtest hdr_dom(host) -i dbtest.erp16.orion-instruments.io
 acl host_parusinstruments hdr_dom(host) -i parusinstruments.erp16.orion-instruments.io
 acl host_punaeyecare hdr_dom(host) -i punaeyecare.erp16.orion-instruments.io
 use_backend be_orion_test if host_oriontest
 use_backend be_db_test if host_dbtest
 use_backend be_parus_instruments if host_parusinstruments
 use_backend be_puna_eye_care if host_punaeyecare
 default_backend be_orion-internal

# Backend names follow the "be_<client_id>" convention (exact clients.yaml
# client_id string, e.g. "orion_test" keeps its underscore, "orion-internal"
# keeps its hyphen) -- this is not cosmetic, DevOps_Files/scripts/
# logging_collector.py's HAProxy access-log parser strips the literal "be_"
# prefix to attribute each request to a client for cross-source correlation
# (see _parse_haproxy_line). A mismatch here silently breaks that
# attribution rather than erroring, so keep this exact on every future
# client addition.
backend be_orion-internal
 balance leastconn
 option tcp-check
 option log-health-checks
 option forwardfor
 http-request set-header X-Forwarded-Host %[req.hdr(host)]
 http-request set-header X-Forwarded-Proto https if { ssl_fc }
 http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

 # Route the live notification websocket traffic
 acl is_websocket hdr(Upgrade) -i calendar-websocket
 acl is_websocket path_beg /websocket
 use-server odoo-im if is_websocket

 server odoo1 127.0.0.1:8069 check inter 5s
 server odoo-im 127.0.0.1:8072 check backup

