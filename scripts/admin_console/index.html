<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP16 Admin Console</title>
<style>
  :root {
    --bg: #fbfbfa; --surface: #f2f1ee; --card: #ffffff;
    --border: #e5e3de; --text: #1a1a18; --text-secondary: #52514c; --text-muted: #726f68;
    --success-bg: #eaf3de; --success-text: #27500a;
    --danger-bg: #f6e6e6; --danger-text: #a32d2d;
    --warning-bg: #faeeda; --warning-text: #854f0b; --warning-border: #f0c98a;
    --accent: #185fa5; --accent-bg: #185fa5; --accent-contrast: #ffffff;
    --shadow: 0 1px 2px rgba(20,20,15,0.05), 0 1px 8px rgba(20,20,15,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715; --surface: #232320; --card: #211f1d;
      --border: #37352f; --text: #f0efec; --text-secondary: #cbc9c0; --text-muted: #a3a099;
      --success-bg: #173404; --success-text: #c0dd97;
      --danger-bg: #3a2020; --danger-text: #f09595;
      --warning-bg: #302205; --warning-text: #fac775; --warning-border: #6b4c14;
      --accent: #85b7eb; --accent-bg: #2f6fb0; --accent-contrast: #ffffff;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 12px rgba(0,0,0,0.18);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 3rem 2.5rem 4rem;
    font-size: 18px; line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-bg);
    color: var(--accent-contrast); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .fetch-note { font-size: 13.5px; color: var(--text-muted); }
  .fetch-note.err { color: var(--danger-text); }
  .header-actions { display: flex; align-items: center; gap: 14px; }
  a.open-staging {
    font: inherit; font-size: 14.5px; font-weight: 600; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--accent) !important; color: var(--accent) !important; text-decoration: none;
  }

  .staging-banner {
    font-size: 14.5px; color: var(--warning-text); background: var(--warning-bg);
    border: 1px solid var(--warning-border); border-radius: 8px; padding: 8px 14px; margin-bottom: 1.6rem;
  }
  .staging-banner code { font-family: ui-monospace, monospace; }

  .section-label {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin: 2rem 0 10px;
  }
  .section-label:first-of-type { margin-top: 0; }

  .clients-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }

  .client-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.4rem 1.6rem; box-shadow: var(--shadow);
  }
  .client-card-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .client-card-title { font-size: 17px; font-weight: 700; }
  .client-card-idle { color: var(--text-secondary); font-size: 15.5px; margin: 10px 0 4px; }
  .peers-note {
    font-size: 13.5px; color: var(--text-muted); margin-bottom: 12px; padding: 6px 10px;
    background: var(--surface); border-radius: 6px;
  }

  .commit-row {
    display: flex; align-items: baseline; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 14.5px;
  }
  .commit-row:last-of-type { border-bottom: none; }
  .commit-hash { font-family: ui-monospace, monospace; font-size: 13px; color: var(--text-muted); flex: none; }
  .commit-msg { color: var(--text); }
  .commit-author { color: var(--text-muted); font-size: 13px; margin-left: auto; flex: none; white-space: nowrap; }

  .staging-note { color: var(--text-secondary); font-size: 14px; margin: 12px 0; }
  .staging-note code { font-family: ui-monospace, monospace; background: var(--surface); padding: 1px 6px; border-radius: 4px; }

  .btn-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  button.act {
    font: inherit; font-size: 14.5px; font-weight: 600; padding: 9px 14px; border-radius: 8px;
    border: 1px solid var(--accent) !important; background: transparent !important; color: var(--accent) !important;
    cursor: pointer; transition: opacity 0.12s ease;
  }
  button.act:disabled { opacity: 0.45; cursor: default; }
  button.act.success {
    background: #4c8c2b !important; border: 1px solid #4c8c2b !important; color: #ffffff !important;
    width: 100%; padding: 12px 16px; font-size: 15px;
  }
  button.act.small { padding: 5px 10px; font-size: 13px; }

  .deploy-block { background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .deploy-block .deploy-heading { color: var(--warning-text); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .deploy-block .deploy-desc { color: var(--warning-text); font-size: 14px; margin-bottom: 12px; }
  .deploy-block .deploy-desc code { font-family: ui-monospace, monospace; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 4px; }

  .job-log {
    font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--text-muted);
    max-height: 140px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px;
    background: var(--surface); border-radius: 6px; padding: 8px 10px;
  }
  .working-row {
    display: flex; align-items: center; gap: 8px; font-size: 13.5px;
    color: var(--text-secondary); margin-top: 10px;
  }
  .spinner-small {
    width: 14px; height: 14px; flex-shrink: 0; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.3rem; box-shadow: var(--shadow); }
  .tile-label { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile-value { font-size: 23px; font-weight: 600; }
  .tile-value.ok { color: var(--success-text); }
  .tile-value.warn { color: var(--warning-text); }

  .history-row {
    display: grid; grid-template-columns: 100px 100px 1fr 90px 70px; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14.5px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-time { color: var(--text-muted); font-size: 13.5px; }
  .badge { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; justify-self: start; }
  .badge.success { background: var(--success-bg); color: var(--success-text); }
  .badge.rolled_back { background: var(--danger-bg); color: var(--danger-text); }
  .history-scope { color: var(--text-secondary); }
  .history-hash { font-family: ui-monospace, monospace; font-size: 13.5px; color: var(--text-muted); }
  .history-dur { color: var(--text-muted); font-size: 13.5px; text-align: right; }
  .empty-note { color: var(--text-muted); font-size: 15px; }

  .history-toggle {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 2rem 0 10px;
  }
  .history-toggle .chev { transition: transform 0.15s ease; font-size: 11px; }
  .history-toggle.open .chev { transform: rotate(90deg); }

  /* Restore-from-backup -- deliberately understated, separated by a
     divider, distinct warning tone -- this discards real data, and
     should never read as a peer action to Review/Deploy. */
  .restore-divider { border-top: 1px dashed var(--border); margin-top: 14px; padding-top: 10px; }
  .restore-link {
    font-size: 13.5px; color: var(--text-muted); background: none; border: none; padding: 0;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .restore-panel {
    margin-top: 10px; background: var(--danger-bg); border: 1px solid var(--danger-text);
    border-radius: 8px; padding: 12px 14px;
  }
  .restore-panel .restore-heading { color: var(--danger-text); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .backup-row {
    display: flex; align-items: baseline; gap: 10px; padding: 6px 0; font-size: 13.5px;
    border-bottom: 1px solid rgba(0,0,0,0.08); cursor: pointer;
  }
  .backup-row:last-child { border-bottom: none; }
  .backup-row:hover { opacity: 0.75; }
  .backup-row.selected { font-weight: 700; }
  .restore-preview { font-size: 13.5px; color: var(--danger-text); margin: 10px 0; }
  .restore-confirm-input {
    font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--danger-text); width: 100%; margin: 8px 0; background: var(--card); color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">A</div>
      <h1>Admin console</h1>
    </div>
    <div class="header-actions">
      <a class="open-staging" href="http://localhost:8209/web/login" target="_blank" rel="noopener">Open staging</a>
      <button class="act" id="check-now-btn" style="padding:7px 14px;font-size:14.5px;">Check for changes</button>
      <div class="fetch-note" id="fetch-note">Checking for updates...</div>
    </div>
  </div>

  <div id="staging-banner-slot"></div>

  <div class="section-label">Clients</div>
  <div class="clients-grid" id="clients-grid"></div>

  <div class="section-label">Health</div>
  <div class="tiles" id="health-tiles"></div>

  <div class="history-toggle" id="history-toggle" onclick="toggleHistory()">
    <span class="chev">&#9656;</span> Deploy history
  </div>
  <div class="card" id="deploy-history-card" style="display:none; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem 1.4rem;"></div>
</div>

<script>
// 127.0.0.1:8209 is staging-web's own direct port binding (clients.yaml's
// staging entry) -- works the same over an SSH tunnel to this port
// regardless of environment.
const STAGING_URL = 'http://localhost:8209/web/login';
let historyOpen = false;
let anyJobRunning = false;
let jobPollTimer = null;
// Set by doReview(), consumed once that client's review job (which
// already waits for staging-web to actually respond) reaches state
// 'done' -- avoids the tab loading staging mid-restart.
let pendingStagingTab = null;
let pendingStagingClient = null;
// {client_id: {open: bool, backups: [...] or null, selected: ts or null}}
let restorePanels = {};

const WAITING_PAGE_HTML = `<!doctype html><html><head><title>Staging</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
    justify-content: center; height: 100vh; margin: 0; background: #1e1e2e; color: #cdd6f4; }
  .box { text-align: center; }
  .spinner { width: 32px; height: 32px; border: 3px solid #45475a; border-top-color: #89b4fa;
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { opacity: 0.8; }
</style></head>
<body><div class="box"><div class="spinner"></div>
<p id="msg">Restarting staging and waiting for it to come back up...</p>
</div></body></html>`;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function renderClientCard(c) {
  const jobRunning = c.job.state === 'running';
  if (jobRunning) anyJobRunning = true;

  let html = '<div class="client-card">';
  html += '<div class="client-card-title-row"><span class="client-card-title">' + esc(c.display_name) + '</span></div>';

  if (c.deploy_peers && c.deploy_peers.length) {
    html += '<div class="peers-note">Shares code with: ' + esc(c.deploy_peers.join(', ')) +
      ' -- deploying here moves all of them together.</div>';
  }

  if (!c.has_pending) {
    html += '<div class="client-card-idle">Live is up to date.</div>';
  } else {
    const commitRows = c.pending_commits.map(cm =>
      '<div class="commit-row">' +
        '<span class="commit-hash">' + esc(cm.short) + '</span>' +
        '<span class="commit-msg">' + esc(cm.subject) + '</span>' +
        '<span class="commit-author">' + esc(cm.author) + '</span>' +
      '</div>'
    ).join('');
    const stagingLabel = c.staging_matches_pending
      ? 'Staging currently reflects: <code>' + esc(c.origin_commit) + '</code> (matches)'
      : 'Staging currently reflects: <code>' + esc(c.staging_commit || 'none') + '</code> (older)';

    html += commitRows + '<div class="staging-note">' + stagingLabel + '</div>';
    if (!c.staging_matches_pending || !c.staging_is_showing_this_client) {
      html += '<div class="btn-row"><button class="act" onclick="doReview(\'' + c.client_id + '\')" ' + (jobRunning ? 'disabled' : '') + '>Review</button></div>';
    }
    if (c.job.kind === 'review' && c.job.log.length) {
      if (jobRunning) html += '<div class="working-row"><span class="spinner-small"></span>Working...</div>';
      html += '<div class="job-log">' + esc(c.job.log.join('\n')) + '</div>';
    }

    if (c.ready_to_deploy && c.staging_is_showing_this_client) {
      html += '<div class="deploy-block">' +
        '<div class="deploy-heading">Ready to deploy</div>' +
        '<div class="deploy-desc">Staging matches <code>' + esc(c.origin_commit) + '</code> and has been reviewed.' +
        (c.deploy_peers.length ? ' This deploys ' + esc(c.deploy_peers.join(', ')) + ' too.' : '') + '</div>' +
        '<button class="act success" onclick="doDeploy(\'' + c.client_id + '\')" ' + (jobRunning ? 'disabled' : '') + '>Approve and deploy</button>';
      if (c.job.kind === 'deploy' && c.job.log.length) {
        if (jobRunning) html += '<div class="working-row"><span class="spinner-small"></span>Working...</div>';
        html += '<div class="job-log">' + esc(c.job.log.join('\n')) + '</div>';
      }
      html += '</div>';
    } else if (c.ready_to_deploy && !c.staging_is_showing_this_client) {
      html += '<div class="staging-note">Staging is currently showing a different client -- review again to deploy this one.</div>';
    }
  }

  html += renderRestoreSection(c);
  html += '</div>';
  return html;
}

function renderRestoreSection(c) {
  const panel = restorePanels[c.client_id] || { open: false, backups: null, selected: null };
  let html = '<div class="restore-divider">';
  html += '<button class="restore-link" onclick="toggleRestore(\'' + c.client_id + '\')">' +
    (panel.open ? 'Hide restore options' : 'Restore from backup...') + '</button>';

  if (panel.open) {
    html += '<div class="restore-panel">';
    html += '<div class="restore-heading">Restore a past snapshot (code + data + filestore)</div>';
    if (panel.backups === null) {
      html += '<div class="empty-note">Loading...</div>';
    } else if (!panel.backups.length) {
      html += '<div class="empty-note">No local backups available.</div>';
    } else {
      html += panel.backups.map(b => {
        const selected = panel.selected === b.timestamp;
        return '<div class="backup-row' + (selected ? ' selected' : '') + '" onclick="selectBackup(\'' + c.client_id + '\',\'' + b.timestamp + '\')">' +
          esc(b.timestamp) + ' &middot; code <span class="commit-hash">' + esc(b.commit || '?') + '</span></div>';
      }).join('');

      if (panel.selected) {
        html += '<div class="restore-preview">This discards all data changes made since ' + esc(panel.selected) +
          ' (orders, records, anything created since then) and reverts code to what was live then. This cannot be undone.</div>';
        html += '<input class="restore-confirm-input" id="restore-confirm-' + c.client_id + '" placeholder="Type &quot;' + esc(c.client_id) + '&quot; to confirm">';
        html += '<button class="act" style="border-color:var(--danger-text) !important;color:var(--danger-text) !important;" onclick="doRestore(\'' + c.client_id + '\')">Restore this snapshot</button>';
      }
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function toggleRestore(clientId) {
  const panel = restorePanels[clientId] || { open: false, backups: null, selected: null };
  panel.open = !panel.open;
  restorePanels[clientId] = panel;
  if (panel.open && panel.backups === null) {
    loadBackups(clientId);
  } else {
    renderAll(lastStatus);
  }
}

async function loadBackups(clientId) {
  try {
    const res = await fetch(`/api/backups/${clientId}`);
    const data = await res.json();
    restorePanels[clientId].backups = data.backups || [];
  } catch (e) {
    restorePanels[clientId].backups = [];
  }
  renderAll(lastStatus);
}

function selectBackup(clientId, ts) {
  restorePanels[clientId].selected = ts;
  renderAll(lastStatus);
}

async function doRestore(clientId) {
  const input = document.getElementById('restore-confirm-' + clientId);
  if (!input || input.value.trim() !== clientId) {
    alert('Type the client name exactly to confirm.');
    return;
  }
  const ts = restorePanels[clientId].selected;
  await fetch(`/api/restore/${clientId}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({timestamp: ts}),
  });
  restorePanels[clientId] = { open: false, backups: null, selected: null };
  refresh();
}

function renderHealth(h) {
  const containersOk = h.containers_total > 0 && h.containers_up === h.containers_total;
  document.getElementById('health-tiles').innerHTML =
    '<div class="tile"><div class="tile-label">Containers up</div>' +
      '<div class="tile-value ' + (containersOk ? 'ok' : 'warn') + '">' + h.containers_up + ' / ' + h.containers_total + '</div></div>' +
    '<div class="tile"><div class="tile-label">Disk used</div>' +
      '<div class="tile-value">' + (h.disk_pct != null ? h.disk_pct + '%' : '--') + '</div></div>' +
    '<div class="tile"><div class="tile-label">Memory used</div>' +
      '<div class="tile-value">' + (h.mem_pct != null ? h.mem_pct + '%' : '--') + '</div></div>';
}

function renderHistory(rows) {
  const el = document.getElementById('deploy-history-card');
  if (!rows.length) {
    el.innerHTML = '<div class="empty-note">No deploys yet.</div>';
    return;
  }
  el.innerHTML = rows.map(r => {
    const badgeClass = r.result === 'success' ? 'success' : 'rolled_back';
    const badgeLabel = r.result === 'success' ? 'Success' : 'Rolled back';
    const when = new Date(r.ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const clients = r.clients || [];
    const scope = clients.length > 1 ? clients.join(', ') : (clients[0] || '--');
    return '<div class="history-row">' +
      '<span class="history-time">' + esc(when) + '</span>' +
      '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '<span class="history-scope">' + esc(scope) + '</span>' +
      '<span class="history-hash">' + esc((r.target_commit || '').slice(0, 7)) + '</span>' +
      '<span class="history-dur">' + esc(r.duration_seconds) + 's</span>' +
    '</div>';
  }).join('');
}

function renderFetchNote(lastFetchAt, lastFetchError) {
  const el = document.getElementById('fetch-note');
  if (lastFetchError) {
    el.textContent = 'Fetch error: ' + lastFetchError;
    el.classList.add('err');
    return;
  }
  el.classList.remove('err');
  if (!lastFetchAt) {
    el.textContent = 'Checking for updates...';
    return;
  }
  el.textContent = 'Last checked: ' + new Date(lastFetchAt).toLocaleTimeString();
}

function toggleHistory() {
  historyOpen = !historyOpen;
  document.getElementById('history-toggle').classList.toggle('open', historyOpen);
  document.getElementById('deploy-history-card').style.display = historyOpen ? 'block' : 'none';
}

let lastStatus = null;

function renderAll(s) {
  if (!s) return;
  document.getElementById('clients-grid').innerHTML = s.clients.map(renderClientCard).join('');

  const banner = document.getElementById('staging-banner-slot');
  banner.innerHTML = s.staging_points_at
    ? '<div class="staging-banner">Staging is currently showing: <code>' + esc(s.staging_points_at) + '</code></div>'
    : '';

  renderHealth(s.health);
  renderHistory(s.deploy_history);

  let mostRecentFetch = null, fetchErr = null;
  for (const c of s.clients) {
    if (c.last_fetch_error) fetchErr = c.last_fetch_error;
    if (c.last_fetch_at && (!mostRecentFetch || c.last_fetch_at > mostRecentFetch)) mostRecentFetch = c.last_fetch_at;
  }
  renderFetchNote(mostRecentFetch, fetchErr);
}

async function refresh() {
  let s;
  try {
    const res = await fetch('/api/status');
    s = await res.json();
  } catch (e) {
    return;
  }
  lastStatus = s;
  anyJobRunning = false;
  renderAll(s);

  if (anyJobRunning) {
    if (!jobPollTimer) jobPollTimer = setInterval(refresh, 1500);
  } else if (jobPollTimer) {
    clearInterval(jobPollTimer);
    jobPollTimer = null;
  }

  if (pendingStagingTab && pendingStagingClient) {
    const c = s.clients.find(x => x.client_id === pendingStagingClient);
    if (c && c.job.kind === 'review' && c.job.state !== 'running') {
      const tab = pendingStagingTab;
      pendingStagingTab = null;
      pendingStagingClient = null;
      if (c.job.state === 'done') {
        stagingReachable().then(ok => {
          if (ok) {
            tab.location.href = STAGING_URL;
          } else if (tab.document) {
            const msg = tab.document.getElementById('msg');
            if (msg) msg.innerHTML = 'Staging is up, but this browser can\'t reach it.<br>Your SSH tunnel for :8443 is probably down -- re-run:<br><code style="opacity:0.9">ssh -L 8443:127.0.0.1:8443 sandbox</code><br>then reload this tab.';
            const spinner = tab.document.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
          }
        });
      } else if (tab.document) {
        const msg = tab.document.getElementById('msg');
        if (msg) msg.textContent = 'Staging did not come back up cleanly -- check this client\'s review log on the admin console before retrying.';
      }
    }
  }
}

async function stagingReachable() {
  try {
    await fetch(STAGING_URL, { mode: 'no-cors', cache: 'no-store' });
    return true;
  } catch (e) {
    return false;
  }
}

async function doReview(clientId) {
  pendingStagingTab = window.open('', '_blank');
  pendingStagingClient = clientId;
  if (pendingStagingTab) {
    pendingStagingTab.document.write(WAITING_PAGE_HTML);
    pendingStagingTab.document.close();
  }
  await fetch(`/api/review/${clientId}`, { method: 'POST' });
  refresh();
}

async function doDeploy(clientId) {
  await fetch(`/api/deploy/${clientId}`, { method: 'POST' });
  refresh();
}

async function checkNow() {
  const btn = document.getElementById('check-now-btn');
  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = 'Checking...';
  try {
    await fetch('/api/check-now', { method: 'POST' });
  } catch (e) {
    // fall through -- refresh() below will surface last_fetch_error if any
  }
  await refresh();
  btn.disabled = false;
  btn.textContent = prevLabel;
}

document.getElementById('check-now-btn').addEventListener('click', checkNow);

refresh();
setInterval(refresh, 3000);
</script>
