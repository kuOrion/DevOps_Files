<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Git Console</title>
<style>
  :root {
    --bg: #fbfbfa; --surface: #f2f1ee; --card: #ffffff;
    --border: #e5e3de; --text: #1a1a18; --text-secondary: #52514c; --text-muted: #726f68;
    --success-bg: #eaf3de; --success-text: #27500a;
    --danger-bg: #f6e6e6; --danger-text: #a32d2d;
    --warning-bg: #faeeda; --warning-text: #854f0b;
    --accent: #185fa5; --accent-bg: #185fa5; --accent-contrast: #ffffff;
    --danger: #a32d2d;
    --shadow: 0 1px 2px rgba(20,20,15,0.05), 0 1px 8px rgba(20,20,15,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715; --surface: #232320; --card: #211f1d;
      --border: #37352f; --text: #f0efec; --text-secondary: #cbc9c0; --text-muted: #a3a099;
      --success-bg: #173404; --success-text: #c0dd97;
      --danger-bg: #3a2020; --danger-text: #f09595;
      --warning-bg: #412402; --warning-text: #fac775;
      --accent: #85b7eb; --accent-bg: #2f6fb0; --accent-contrast: #ffffff;
      --danger: #f09595;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 12px rgba(0,0,0,0.18);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 2.5rem 3vw 4rem;
    font-size: 18px; line-height: 1.55;
  }
  /* 2026-08-30: was max-width:1180px, centered -- left ~20%/right ~20% sat
     empty on any screen wider than that while the actual client grid (the
     whole point of this page) got squeezed into the middle. No reason for
     a hard cap now that every client gets its own card -- more width just
     means more columns, handled already by the grid's own auto-fit. */
  .wrap { max-width: 1800px; margin: 0 auto; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-bg);
    color: var(--accent-contrast); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; letter-spacing: -0.02em;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .docker-status { font-size: 14.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.up { background: #5fa233; } .dot.down { background: var(--danger); }

  .section-label {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin: 0 0 10px;
  }

  /* Wider min per card (was 260px) -- each card now carries more content
     (run state + changes summary + up to 4 buttons) than the old
     container-only cards did, so a narrower card wrapped awkwardly. No
     max-width cap either (was 340px) -- on a wide screen this lets cards
     genuinely fill the row instead of leaving whitespace next to a few
     stretched-wide ones. */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.4rem 1.6rem; box-shadow: var(--shadow);
  }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .card-title { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
  .badge { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .badge.running { background: var(--success-bg); color: var(--success-text); }
  .badge.starting { background: var(--warning-bg); color: var(--warning-text); }
  .meta { font-size: 16px; color: var(--text-secondary); line-height: 1.9; }

  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    flex: 1; font: inherit; font-size: 15px; font-weight: 600; padding: 9px 14px; border-radius: 8px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
    min-width: 120px;
  }
  button:hover:not(:disabled) { background: var(--surface); }
  button:active:not(:disabled) { transform: translateY(0.5px); }
  button:disabled { opacity: 0.45; cursor: default; }
  .btn-spinner {
    display: inline-block; width: 13px; height: 13px; margin-right: 7px;
    border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff; border-radius: 50%;
    vertical-align: -2px; animation: btn-spin 0.7s linear infinite;
  }
  @keyframes btn-spin { to { transform: rotate(360deg); } }
  button.success { background: #4c8c2b; border-color: #4c8c2b; color: #fff; }
  button.success:hover:not(:disabled) { opacity: 0.9; background: #4c8c2b; }

  input[type=text] {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 10px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  .changes-summary {
    font-size: 15px; color: var(--text-secondary); margin: 12px 0 0; padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .progress-track { height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; margin-top: 10px; }
  .progress-fill {
    height: 100%; width: 40%; border-radius: 3px; background: var(--accent-bg);
    animation: progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes progress-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .progress-step { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }
  .log {
    font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--text-muted);
    max-height: 100px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px;
    background: var(--surface); border-radius: 6px; padding: 6px 8px;
  }

  /* Modal -- opened per-client from a card's "Review changes". Not
     position:fixed for the same reason none of this project's other
     consoles use it for overlays: keeps behavior predictable and simple
     for a page that's always the full browser viewport anyway (this is a
     local dev tool, never embedded). */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; padding: 3vh 2vw; z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 12px; width: 100%; max-width: 900px;
    max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex: none;
  }
  .modal-header-title { font-weight: 600; font-size: 16px; }
  .modal-close {
    flex: none; min-width: unset; width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
  }
  .modal-body { overflow-y: auto; padding: 10px 0; flex: 1 1 auto; }
  .modal-footer {
    flex: none; padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-start;
  }
  .modal-footer input[type=text] { margin-bottom: 0; }
  .modal-footer button { flex: none; min-width: 160px; }

  .diff-file { margin: 0 20px 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .diff-file:last-child { margin-bottom: 0; }
  .diff-file-name {
    padding: 8px 14px; font-size: 14px; font-weight: 600; background: var(--surface);
    border-bottom: 1px solid var(--border); font-family: ui-monospace, monospace;
  }
  .diff-line {
    font-family: ui-monospace, monospace; font-size: 13.5px; padding: 1px 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .diff-line.context { color: var(--text-secondary); }
  .diff-line.add { background: var(--success-bg); color: var(--success-text); }
  .diff-line.del { background: var(--danger-bg); color: var(--danger-text); }
  .diff-line.skip { color: var(--text-muted); font-style: italic; padding-top: 4px; padding-bottom: 4px; }
  .diff-span-changed.add { background: rgba(99,153,34,0.3); border-radius: 2px; font-weight: 600; }
  .diff-span-changed.del { background: rgba(226,75,74,0.3); border-radius: 2px; text-decoration: line-through; }
  .diff-empty { color: var(--text-secondary); font-size: 15px; text-align: center; padding: 1.5rem; }

  .commit-hash { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 13.5px; }
  .recent-section {
    margin: 8px 20px 0; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .recent-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .send-row { display: flex; gap: 10px; padding: 6px 0; }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #fff; flex: none; margin-top: 1px;
  }
  .send-info { min-width: 0; }
  .send-subject { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .send-meta { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
  .empty-note { color: var(--text-secondary); font-weight: 500; font-size: 15px; padding: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">16</div>
      <h1>Git Console</h1>
    </div>
    <div class="docker-status" id="docker-status"><span class="dot" id="docker-dot"></span><span id="docker-text">checking docker...</span></div>
  </div>

  <div class="section-label">Clients</div>
  <div class="grid" id="clients-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-header-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="modal-diff"></div>
      <div class="recent-section">
        <div class="recent-label">Recent sends</div>
        <div id="modal-recent"></div>
      </div>
    </div>
    <div class="modal-footer">
      <input type="text" id="modal-send-msg" placeholder="Please describe changes">
      <button class="success" onclick="sendForReview()" id="modal-send-btn">Send for Review</button>
    </div>
  </div>
</div>

<script>
let clientsData = [];
let jobsData = {};
let gitData = {};
let currentModalClient = null;

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function stepLabel(logLines) {
  if (!logLines || !logLines.length) return 'Starting...';
  const last = logLines[logLines.length - 1];
  return last.replace(/^===\s*/, '').replace(/\s*===$/, '') || 'Working...';
}

function changesSummary(git) {
  if (!git) return null;
  if (git.files.length) {
    let added = 0, removed = 0;
    git.files.forEach(f => { added += parseInt(f.added) || 0; removed += parseInt(f.removed) || 0; });
    return `${git.files.length} file${git.files.length === 1 ? '' : 's'} changed &middot; +${added} -${removed}`;
  }
  if (git.ahead_count) return `${git.ahead_count} saved, ready to send`;
  return null;
}

function renderClientCard(c) {
  const job = jobsData[c.client_id] || { state: 'idle', log: [] };
  const git = gitData[c.client_id];
  const busy = job.state === 'running';
  const summary = changesSummary(git);

  let html = '<div class="card">';
  html += '<div class="card-title-row">';
  html += `<span class="card-title">${escapeHtml(c.display_name)}</span>`;
  html += `<span class="badge ${busy ? 'starting' : c.running ? 'running' : ''}" style="${!busy && !c.running ? 'background:var(--surface);color:var(--text-secondary);' : ''}">${busy ? 'Working' : c.running ? 'Running' : 'Stopped'}</span>`;
  html += '</div>';

  if (busy) {
    html += `<div class="progress-step">${escapeHtml(stepLabel(job.log))}</div>`;
    html += '<div class="progress-track"><div class="progress-fill"></div></div>';
    html += `<div class="log">${escapeHtml((job.log || []).slice(-6).join('\n'))}</div>`;
  } else if (c.running) {
    html += `<div class="meta"><a href="${c.url}" target="_blank">${c.url}</a></div>`;
    html += `<div class="btn-row"><button onclick="window.open('${c.url}')">Open</button><button onclick="stopClient('${c.client_id}')">Stop</button></div>`;
  } else {
    html += `<div class="btn-row"><button onclick="getLatest('${c.client_id}')">Get Latest</button><button onclick="startClient('${c.client_id}')">Start Container</button></div>`;
  }

  if (!busy && git && git.not_cloned) {
    html += `<div class="changes-summary">Not cloned locally yet -- run <code>git clone git@github.com:kuOrion/erp16-${c.client_id}.git ${escapeHtml(git.repo)}</code> as a sibling of this checkout.</div>`;
  } else if (!busy && summary) {
    html += `<div class="changes-summary">${summary}</div>`;
    html += '<div class="btn-row">';
    html += `<button onclick="openModal('${c.client_id}')">Review changes</button>`;
    html += `<button onclick="saveChanges('${c.client_id}')">Save Changes</button>`;
    html += '</div>';
  }

  html += '</div>';
  return html;
}

async function refreshClients() {
  const [clientsRes, gitRes] = await Promise.all([
    fetch('/api/clients'),
    fetch('/api/git/status-all'),
  ]);
  const clientsPayload = await clientsRes.json();
  gitData = await gitRes.json();
  clientsData = clientsPayload.clients;
  jobsData = clientsPayload.jobs;

  document.getElementById('clients-grid').innerHTML = clientsData.map(renderClientCard).join('');
}

async function startClient(id) {
  await fetch(`/api/start/${id}`, { method: 'POST' });
  refreshClients();
}

async function getLatest(id) {
  await fetch(`/api/get-latest/${id}`, { method: 'POST' });
  refreshClients();
}

async function stopClient(id) {
  await fetch(`/api/stop/${id}`, { method: 'POST' });
  refreshClients();
}

async function saveChanges(id) {
  const res = await fetch(`/api/save-changes/${id}`, { method: 'POST' });
  if (res.ok) {
    refreshClients();
  } else {
    const err = await res.json();
    alert(err.error || 'Nothing to save.');
  }
}

function renderSpans(spans, kind) {
  return spans.map(([text, changed]) => {
    const escaped = escapeHtml(text) || ' ';
    return changed ? `<span class="diff-span-changed ${kind}">${escaped}</span>` : escaped;
  }).join('');
}

function renderHunks(hunks) {
  return hunks.map(h => {
    if (h.type === 'skip') return `<div class="diff-line skip">&hellip; ${h.count} unchanged line${h.count === 1 ? '' : 's'} &hellip;</div>`;
    if (h.type === 'context') return `<div class="diff-line context">${escapeHtml(h.text) || '&nbsp;'}</div>`;
    if (h.type === 'add') return `<div class="diff-line add">+ ${renderSpans(h.spans, 'add')}</div>`;
    if (h.type === 'del') return `<div class="diff-line del">- ${renderSpans(h.spans, 'del')}</div>`;
    return '';
  }).join('');
}

function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${hash % 360}, 50%, 42%)`;
}
function initials(name) {
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}

async function openModal(id) {
  currentModalClient = id;
  const c = clientsData.find(x => x.client_id === id);
  document.getElementById('modal-title').textContent = (c ? c.display_name : id);
  document.getElementById('modal-send-msg').value = '';
  document.getElementById('modal-diff').innerHTML = '<div class="diff-empty">Loading...</div>';
  document.getElementById('modal-recent').innerHTML = '';
  document.getElementById('modal-overlay').classList.add('open');

  const [diffRes, sendsRes] = await Promise.all([
    fetch(`/api/git/diff/${id}`),
    fetch(`/api/recent-sends/${id}`),
  ]);
  const diffData = await diffRes.json();
  document.getElementById('modal-diff').innerHTML = diffData.files.map(f => `
    <div class="diff-file">
      <div class="diff-file-name">${escapeHtml(f.path)}</div>
      ${renderHunks(f.hunks)}
    </div>`).join('') || '<div class="diff-empty">No uncommitted changes -- everything here is already saved and just needs sending.</div>';

  const sendsData = await sendsRes.json();
  const recentEl = document.getElementById('modal-recent');
  if (!sendsData.sends.length) {
    recentEl.innerHTML = '<div class="empty-note">No sends yet</div>';
  } else {
    recentEl.innerHTML = sendsData.sends.slice(0, 8).map(s => `
      <div class="send-row">
        <span class="avatar" style="background:${avatarColor(s.author)}">${initials(s.author)}</span>
        <div class="send-info">
          <div class="send-subject">${escapeHtml(s.subject)}</div>
          <div class="send-meta">${escapeHtml(s.author)} &middot; ${escapeHtml(s.when)} &middot; <span class="commit-hash">${s.hash}</span></div>
        </div>
      </div>`).join('');
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  currentModalClient = null;
}

async function sendForReview() {
  if (!currentModalClient) return;
  const btn = document.getElementById('modal-send-btn');
  if (btn.disabled) return;  // already in flight -- ignore repeat clicks/Enter presses
  const box = document.getElementById('modal-send-msg');
  const message = box.value.trim();
  if (!message) { alert('Please describe changes first -- a few words is enough.'); return; }
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span>Sending...';
  try {
    const res = await fetch(`/api/send-for-review/${currentModalClient}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message}),
    });
    if (res.ok) {
      closeModal();
      refreshClients();
    } else {
      const err = await res.json();
      alert(err.error || 'Could not send for review.');
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'modal-send-msg') {
    sendForReview();
  }
  if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('open')) {
    closeModal();
  }
});

async function refreshDockerStatus() {
  try {
    await fetch('/api/clients');
    document.getElementById('docker-dot').className = 'dot up';
    document.getElementById('docker-text').textContent = 'Docker running';
  } catch (e) {
    document.getElementById('docker-dot').className = 'dot down';
    document.getElementById('docker-text').textContent = 'Docker unreachable';
  }
}

function refreshAll() {
  refreshDockerStatus();
  refreshClients();
}

refreshAll();
setInterval(refreshAll, 3000);
</script>
</body>
</html>
