<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Git Console</title>
<style>
  :root {
    --bg: #fbfbfa; --surface: #f2f1ee; --card: #ffffff;
    --border: #e5e3de; --text: #1a1a18; --text-secondary: #52514c; --text-muted: #726f68;
    --success-bg: #eaf3de; --success-text: #27500a;
    --danger-bg: #f6e6e6; --danger-text: #a32d2d;
    --warning-bg: #faeeda; --warning-text: #854f0b;
    --accent: #185fa5; --accent-bg: #185fa5; --accent-contrast: #ffffff;
    --danger: #a32d2d;
    --shadow: 0 1px 2px rgba(20,20,15,0.05), 0 1px 8px rgba(20,20,15,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715; --surface: #232320; --card: #211f1d;
      --border: #37352f; --text: #f0efec; --text-secondary: #cbc9c0; --text-muted: #a3a099;
      --success-bg: #173404; --success-text: #c0dd97;
      --danger-bg: #3a2020; --danger-text: #f09595;
      --warning-bg: #412402; --warning-text: #fac775;
      --accent: #85b7eb; --accent-bg: #2f6fb0; --accent-contrast: #ffffff;
      --danger: #f09595;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 12px rgba(0,0,0,0.18);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 3rem 2.5rem 4rem;
    font-size: 18px; line-height: 1.55;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-bg);
    color: var(--accent-contrast); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; letter-spacing: -0.02em;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .docker-status { font-size: 14.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.up { background: #5fa233; } .dot.down { background: var(--danger); }

  .section-label {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin: 2.25rem 0 10px;
  }
  .section-label:first-of-type { margin-top: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.4rem 1.6rem; box-shadow: var(--shadow);
  }
  /* Only cards inside the auto-fit clients grid get capped -- with few
     cards, 1fr stretches each one to fill the row, which looks comically
     wide with just one or two running clients. Other .card uses
     (Changes, diff detail, Recent Sends) have their own explicit sizing
     and shouldn't be capped the same way. */
  .grid > .card { max-width: 340px; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .card-title { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
  .badge { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .badge.running { background: var(--success-bg); color: var(--success-text); }
  .badge.starting { background: var(--warning-bg); color: var(--warning-text); }
  .badge.warn { background: var(--warning-bg); color: var(--warning-text); }
  .meta { font-size: 16px; color: var(--text-secondary); line-height: 1.9; }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    flex: 1; font: inherit; font-size: 15.5px; font-weight: 600; padding: 10px 16px; border-radius: 8px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
    min-width: 140px;
  }
  button:hover:not(:disabled) { background: var(--surface); }
  button:active:not(:disabled) { transform: translateY(0.5px); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.success { background: #4c8c2b; border-color: #4c8c2b; color: #fff; }
  button.success:hover:not(:disabled) { opacity: 0.9; background: #4c8c2b; }

  input[type=text] {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 10px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  select {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 10px;
  }

  .git-file { display: flex; justify-content: space-between; font-family: ui-monospace, monospace; font-size: 14.5px; padding: 5px 0; }
  .code-added { color: #3a7a13; } .code-modified { color: var(--accent); } .code-deleted { color: var(--danger); }
  .divider { border-top: 1px solid var(--border); margin: 14px 0 0; padding-top: 14px; }

  .progress-track {
    height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; margin-top: 10px;
  }
  .progress-fill {
    height: 100%; width: 40%; border-radius: 3px; background: var(--accent-bg);
    animation: progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes progress-slide {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
  .progress-step { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }

  .log {
    font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--text-muted);
    max-height: 100px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px;
    background: var(--surface); border-radius: 6px; padding: 6px 8px;
  }

  .changes-row { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 14px; align-items: start; }
  @media (max-width: 760px) { .changes-row { grid-template-columns: 1fr; } }

  .diff-detail-card { min-height: 160px; max-height: 62vh; overflow-y: auto; }
  .diff-detail-placeholder { color: var(--text-secondary); font-size: 15.5px; text-align: center; padding: 2rem 1rem; }
  .diff-file { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .diff-file:last-child { margin-bottom: 0; }
  .diff-file-name {
    padding: 8px 14px; font-size: 14px; font-weight: 600; background: var(--surface);
    border-bottom: 1px solid var(--border); font-family: ui-monospace, monospace;
    position: sticky; top: 0;
  }
  .diff-line {
    font-family: ui-monospace, monospace; font-size: 13.5px; padding: 1px 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .diff-line.context { color: var(--text-secondary); }
  .diff-line.add { background: var(--success-bg); color: var(--success-text); }
  .diff-line.del { background: var(--danger-bg); color: var(--danger-text); }
  .diff-line.skip { color: var(--text-muted); font-style: italic; padding-top: 4px; padding-bottom: 4px; }
  .diff-span-changed.add { background: rgba(99,153,34,0.3); border-radius: 2px; font-weight: 600; }
  .diff-span-changed.del { background: rgba(226,75,74,0.3); border-radius: 2px; text-decoration: line-through; }

  .commit-hash { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 13.5px; }

  .sends-toggle {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 2.25rem 0 10px;
  }
  .sends-toggle .chev { transition: transform 0.15s ease; font-size: 11px; }
  .sends-toggle.open .chev { transform: rotate(90deg); }
  .sends-card { padding-top: 1rem; padding-bottom: 0.6rem; max-height: 420px; overflow-y: auto; }
  .send-row { display: flex; gap: 10px; padding: 8px 0; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 700; color: #fff; flex: none; margin-top: 1px;
  }
  .send-info { min-width: 0; }
  .send-subject { font-size: 15.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .send-meta { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

  .changes-idle { text-align: center; padding: 1rem 0.5rem; }
  .changes-idle p { color: var(--text-secondary); font-size: 15.5px; margin: 0; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty-note { color: var(--text-secondary); font-weight: 500; font-size: 15.5px; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">16</div>
      <h1>Git Console</h1>
    </div>
    <div class="docker-status" id="docker-status"><span class="dot" id="docker-dot"></span><span id="docker-text">checking docker...</span></div>
  </div>

  <div class="section-label">Clients / Containers</div>
  <div class="grid" id="clients-grid">
    <div class="card" id="picker-card" style="border-style:dashed; box-shadow:none;">
      <select id="client-picker"></select>
      <div class="btn-row">
        <button onclick="getLatest()" id="get-latest-btn">Get Latest</button>
        <button onclick="startClient()" id="start-container-btn">Start Container</button>
      </div>
    </div>
  </div>

  <div class="section-label">Changes</div>
  <div class="changes-row">
    <div class="card" id="changes-card">
      <div id="changes-idle-view" class="changes-idle" style="display:none;">
        <p>No changes yet in <span id="repo-name-idle" style="font-weight:600;"></span>.</p>
      </div>

      <div id="changes-active-view" style="display:none;">
        <div class="card-title-row">
          <span style="font-weight:600; font-size:16px;" id="repo-name-active"></span>
          <span class="badge warn" id="changes-badge"></span>
        </div>
        <div id="git-files"></div>

        <div class="divider">
          <input type="text" id="send-msg" placeholder="Please describe changes" style="display:none;">
          <div class="btn-row">
            <button onclick="toggleDiff()" id="diff-toggle-btn">Review changes</button>
            <button onclick="saveChanges()">Save Changes</button>
            <button class="success" onclick="sendForReview()" id="send-btn">Send for Review</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card diff-detail-card" id="diff-detail-card">
      <div class="diff-detail-placeholder">Click "Review changes" to see them here.</div>
    </div>
  </div>

  <div class="sends-toggle" id="sends-toggle" onclick="toggleSends()">
    <span class="chev">&#9656;</span> Recent Sends
  </div>
  <div class="card sends-card" id="sends-card" style="display:none;"></div>
</div>

<script>
let lastStatus = null;
let sendsOpen = false;
let sendsLoaded = false;
let diffOpen = false;

function stepLabel(logLines) {
  if (!logLines || !logLines.length) return 'Starting...';
  const last = logLines[logLines.length - 1];
  return last.replace(/^===\s*/, '').replace(/\s*===$/, '') || 'Working...';
}

let lastStoppedKey = null;

async function refreshClients() {
  const res = await fetch('/api/clients');
  const data = await res.json();

  const runningIds = new Set(data.clients.filter(c => c.running).map(c => c.client_id));
  const startingIds = Object.keys(data.jobs).filter(id => data.jobs[id].state === 'running' && !runningIds.has(id));
  const runningCards = data.clients.filter(c => c.running);
  const stoppedIds = data.clients.filter(c => !c.running && !startingIds.includes(c.client_id)).map(c => c.client_id);

  // The picker card (#picker-card) is a STABLE element, defined once in
  // the static HTML and never recreated here -- rebuilding it every 3s
  // poll (the old approach) forcibly closed the native <select> dropdown
  // if it happened to be open, and silently reset whatever the user had
  // picked. Only touch what actually needs to change.
  const stoppedKey = stoppedIds.join(',');
  if (stoppedKey !== lastStoppedKey) {
    lastStoppedKey = stoppedKey;
    const picker = document.getElementById('client-picker');
    const previousSelection = picker.value;
    picker.innerHTML = stoppedIds.map(id => `<option value="${id}">${id}</option>`).join('');
    if (stoppedIds.includes(previousSelection)) picker.value = previousSelection;
  }
  const anyBusy = startingIds.length > 0 || Object.values(data.jobs).some(j => j.state === 'running');
  const pickerDisabled = anyBusy || !stoppedIds.length;
  document.getElementById('get-latest-btn').disabled = pickerDisabled;
  document.getElementById('start-container-btn').disabled = pickerDisabled;

  // Dynamic cards (starting/running) live after #picker-card in DOM
  // order (picker stays first/leftmost) -- remove and reinsert just
  // these each poll, never touching the picker card itself.
  document.querySelectorAll('.dynamic-client-card').forEach(el => el.remove());
  let dynamicHtml = '';

  // Clients mid Get Latest / Start Container, before Docker even reports
  // them as running yet (rendering/pulling/restoring can take 20-100+s
  // on a cold pull) -- their own card, so something is visibly happening
  // instead of the UI looking frozen.
  for (const id of startingIds) {
    const job = data.jobs[id];
    dynamicHtml += `
      <div class="card dynamic-client-card">
        <div class="card-title-row">
          <span class="card-title">${id}</span>
          <span class="badge starting">Starting</span>
        </div>
        <div class="progress-step">${stepLabel(job.log)}</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="log">${(job.log || []).slice(-6).join('\\n')}</div>
      </div>`;
  }

  for (const c of runningCards) {
    const job = data.jobs[c.client_id];
    const busy = job && job.state === 'running';
    dynamicHtml += `
      <div class="card dynamic-client-card">
        <div class="card-title-row">
          <span class="card-title">${c.display_name}</span>
          <span class="badge running">Running</span>
        </div>
        <div class="meta">
          <div><a href="${c.url}" target="_blank">${c.url}</a></div>
        </div>
        <div class="btn-row">
          <button onclick="window.open('${c.url}')">Open</button>
          <button onclick="stopClient('${c.client_id}')" ${busy ? 'disabled' : ''}>${busy ? 'Working...' : 'Stop'}</button>
        </div>
        ${busy ? `
          <div class="progress-step">${stepLabel(job.log)}</div>
          <div class="progress-track"><div class="progress-fill"></div></div>
          <div class="log">${(job.log || []).slice(-6).join('\\n')}</div>` : ''}
      </div>`;
  }

  document.getElementById('picker-card').insertAdjacentHTML('afterend', dynamicHtml);
}

async function startClient() {
  const id = document.getElementById('client-picker').value;
  await fetch(`/api/start/${id}`, {method: 'POST'});
  refreshClients();
}

async function getLatest() {
  const id = document.getElementById('client-picker').value;
  await fetch(`/api/get-latest/${id}`, {method: 'POST'});
  refreshClients();
}

async function stopClient(id) {
  await fetch(`/api/stop/${id}`, {method: 'POST'});
  refreshClients();
  refreshChanges();
}

async function refreshChanges() {
  const res = await fetch('/api/git/status');
  const data = await res.json();
  lastStatus = data;

  const idleView = document.getElementById('changes-idle-view');
  const activeView = document.getElementById('changes-active-view');

  if (!data.files.length && !data.ahead_count) {
    idleView.style.display = 'block';
    activeView.style.display = 'none';
    document.getElementById('repo-name-idle').textContent = data.repo;
    return;
  }

  idleView.style.display = 'none';
  activeView.style.display = 'block';
  document.getElementById('repo-name-active').textContent = data.repo;

  const badge = document.getElementById('changes-badge');
  // Saved-but-unsent state: no uncommitted files (Save Changes already
  // committed them locally), but real commits sitting ahead of origin/main
  // that Send for Review still needs to push -- keep that button visible
  // and say so explicitly rather than showing a stale/misleading count.
  badge.textContent = data.files.length
    ? `${data.files.length} unsaved`
    : `${data.ahead_count} saved, ready to send`;

  document.getElementById('git-files').innerHTML = data.files.map(f => {
    const cls = f.code.includes('A') ? 'code-added' : f.code.includes('D') ? 'code-deleted' : 'code-modified';
    return `<div class="git-file"><span><span class="${cls}">${f.code}</span>&nbsp;&nbsp;${f.path}</span><span style="color:var(--text-muted)">+${f.added} -${f.removed}</span></div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function renderSpans(spans, kind) {
  return spans.map(([text, changed]) => {
    const escaped = escapeHtml(text) || ' ';
    return changed ? `<span class="diff-span-changed ${kind}">${escaped}</span>` : escaped;
  }).join('');
}

function renderHunks(hunks) {
  return hunks.map(h => {
    if (h.type === 'skip') return `<div class="diff-line skip">&hellip; ${h.count} unchanged line${h.count === 1 ? '' : 's'} &hellip;</div>`;
    if (h.type === 'context') return `<div class="diff-line context">${escapeHtml(h.text) || '&nbsp;'}</div>`;
    if (h.type === 'add') return `<div class="diff-line add">+ ${renderSpans(h.spans, 'add')}</div>`;
    if (h.type === 'del') return `<div class="diff-line del">- ${renderSpans(h.spans, 'del')}</div>`;
    return '';
  }).join('');
}

async function toggleDiff() {
  const panel = document.getElementById('diff-detail-card');
  const btn = document.getElementById('diff-toggle-btn');
  diffOpen = !diffOpen;
  if (!diffOpen) {
    panel.innerHTML = '<div class="diff-detail-placeholder">Click "Review changes" to see them here.</div>';
    btn.textContent = 'Review changes';
    return;
  }
  btn.textContent = 'Hide changes';
  const res = await fetch('/api/git/diff');
  const data = await res.json();
  panel.innerHTML = data.files.map(f => `
    <div class="diff-file">
      <div class="diff-file-name">${f.path}</div>
      ${renderHunks(f.hunks)}
    </div>`).join('') || '<div class="diff-detail-placeholder">No changes</div>';
}

async function saveChanges() {
  const res = await fetch('/api/save-changes', {method: 'POST'});
  if (res.ok) {
    refreshChanges();
    if (diffOpen) toggleDiff();
  } else {
    const err = await res.json();
    alert(err.error || 'Nothing to save.');
  }
}

async function sendForReview() {
  const box = document.getElementById('send-msg');
  if (box.style.display !== 'block') {
    box.style.display = 'block';
    box.focus();
    return;
  }
  const message = box.value.trim();
  if (!message) { alert('Please describe changes first -- a few words is enough.'); return; }
  const res = await fetch('/api/send-for-review', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message}),
  });
  if (res.ok) {
    box.value = '';
    box.style.display = 'none';
    if (diffOpen) toggleDiff();
    refreshChanges();
    if (sendsOpen) refreshSends();
  } else {
    const err = await res.json();
    alert(err.error || 'Could not send for review.');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'send-msg') {
    sendForReview();
  }
});

function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return `hsl(${hash % 360}, 50%, 42%)`;
}
function initials(name) {
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}

async function refreshSends() {
  const res = await fetch('/api/recent-sends');
  const data = await res.json();
  const el = document.getElementById('sends-card');
  if (!data.sends.length) {
    el.innerHTML = '<div class="empty-note">No sends yet</div>';
    return;
  }
  el.innerHTML = data.sends.map(s => `
    <div class="send-row">
      <span class="avatar" style="background:${avatarColor(s.author)}">${initials(s.author)}</span>
      <div class="send-info">
        <div class="send-subject">${s.subject}</div>
        <div class="send-meta">${s.author} &middot; ${s.when} &middot; <span class="commit-hash">${s.hash}</span></div>
      </div>
    </div>`).join('');
}

function toggleSends() {
  sendsOpen = !sendsOpen;
  document.getElementById('sends-toggle').classList.toggle('open', sendsOpen);
  document.getElementById('sends-card').style.display = sendsOpen ? 'block' : 'none';
  if (sendsOpen && !sendsLoaded) { sendsLoaded = true; refreshSends(); }
}

async function refreshDockerStatus() {
  try {
    await fetch('/api/clients');
    document.getElementById('docker-dot').className = 'dot up';
    document.getElementById('docker-text').textContent = 'Docker running';
  } catch (e) {
    document.getElementById('docker-dot').className = 'dot down';
    document.getElementById('docker-text').textContent = 'Docker unreachable';
  }
}

function refreshAll() {
  refreshDockerStatus();
  refreshClients();
  refreshChanges();
  if (sendsOpen) refreshSends();
}

refreshAll();
setInterval(refreshAll, 3000);
</script>
</body>
</html>
