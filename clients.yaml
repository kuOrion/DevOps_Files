    onprem_tier: null         # tier1 | tier2 | null (only meaningful if hosting: onprem)
    list_db: false             # 2026-08-15: real cutover, single-tenant container -- closes the
                               # standing list_db security TODO for real, not deferred again
    proxy_mode: true           # 2026-08-15: real cutover -- genuinely behind the production HAProxy
                               # (config/haproxy-production.cfg), trusts X-Forwarded-* for real client IPs
    workers: 2
    cron_enabled: true        # 2026-08-15: real cutover (milestone 5/10) -- real users depend on
                               # scheduled actions (invoicing, mail queues, etc), must not be silently off
    http_port: 8069           # host-side bind (127.0.0.1 only) — must be unique per client on one host
