# Single source of truth for per-client deployment config.
# render-client.sh reads this + templates/ to generate each client's
# docker-compose.yml/odoo.conf — never hand-maintain those files directly.
#
# Secrets are NOT stored here. `secrets_ref` is an AWS SSM Parameter Store
# path prefix, resolved at render time (milestone 2, live as of 2026-08-01) -
# currently the sandbox's own SSM (under /erp16-sandbox/*), repointed at the
# client's real AWS account once that access is granted. Clients with no
# secrets_ref fall back to build/secrets.local.yaml (gitignored, local-only).

clients:
  18dec:
    display_name: "Orion Internal Test (18 Dec)"
    db_name: db_orion_test_18_dec
    odoo_version: "16.0"
    postgres_version: "14.15"
    hosting: cloud            # cloud | onprem
    onprem_tier: null         # tier1 | tier2 | null (only meaningful if hosting: onprem)
    list_db: true             # flip to false once per-client HAProxy routing exists (milestone 5/6)
    proxy_mode: false         # true once behind HAProxy
    workers: 2
    cron_enabled: false       # sandbox-safety default: no cron worker at all (kills any outbound-capable
                               # automation - mail queues, SMS, payment post-process - regardless of what's
                               # active in the restored DB). Only flip true for a real deploy (milestone 5/10).
    http_port: 8069           # host-side bind (127.0.0.1 only) — must be unique per client on one host
    longpolling_port: 8072
    domain: null              # HAProxy routing target once per-client routing exists; null = not yet exposed
    secrets_ref: /erp16-sandbox/18dec   # sandbox SSM path prefix (see build/README.md); repointed at the
                                        # client's real AWS account once milestone 2 is production-ready
    modules:                  # verified 2026-07-31 via ir_module_module state='installed'
                               # intersected against addons/all/latest/ — validated at
                               # render/deploy time, don't hand-edit without re-checking
